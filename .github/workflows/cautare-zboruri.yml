# Căutarea zilnică a prețurilor la zboruri.
# Pornește:
#   1) zilnic (cron)                          - caută toate alertele active
#   2) manual, din tab-ul Actions             - "Run workflow"
#   3) când se modifică data/alerts.json      - caută doar ce e nou/modificat
#   4) când aplicația cere o căutare rapidă   - fișier nou în data/searches/
#   5) când aplicația cere „preț la companie” - fișier nou în data/prices/
name: Căutare zboruri

on:
  schedule:
    # În fiecare oră, la minutul 17 (nu :00, când GitHub e aglomerat și întârzie rulările).
    # Scriptul caută doar alertele care au o oră programată (ora României) la care nu s-au căutat încă.
    # Rulările fără nimic programat se opresc în câteva secunde: fără credite și fără commit.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Caută din nou chiar dacă s-a căutat deja azi (consumă credite)"
        type: boolean
        default: false
      test_notificari:
        description: "Doar trimite o notificare de TEST (nu caută, nu consumă credite)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - data/alerts.json
      - data/searches/**
      - data/prices/**

permissions:
  contents: write # necesar pentru a salva rezultatele în repository

# Nu lăsăm două rulări simultane (ar încerca să salveze aceleași fișiere)
concurrency:
  group: cautare-zboruri
  cancel-in-progress: false

jobs:
  cauta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descarcă codul
        uses: actions/checkout@v4
        with:
          # mereu ultima versiune (nu cea de la momentul declanșării): dacă au pornit mai multe rulări
          # la rând (ex. mai multe ștergeri rapide din aplicație), fiecare vede ce a salvat cea dinainte
          ref: main

      - name: Instalează Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip # păstrează pachetele între rulări (mai rapid)

      - name: Instalează dependențele
        run: pip install -r requirements.txt

      - name: Trimite notificarea de test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notificari }}
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m scraper.main --test-notification

      - name: Caută prețurile
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_notificari) }}
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SEARCH_PASSWORD: ${{ secrets.SEARCH_PASSWORD }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '--force' || '' }}
        run: python -m scraper.main $FORCE

      - name: Salvează rezultatele în repository
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_notificari) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nimic nou de salvat."
            exit 0
          fi
          git commit -m "Rezultate zboruri $(TZ=Europe/Bucharest date '+%Y-%m-%d %H:%M')"
          # Dacă între timp s-a modificat ceva (ex. o alertă din aplicație), ne sincronizăm și reîncercăm.
          # La conflict pe fișierele scrise de robot (index.json, status.json) păstrăm versiunea acestei rulări (-X theirs).
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Nu am reușit să salvez rezultatele."
          exit 1
