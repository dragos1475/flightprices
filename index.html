<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Monitor Zboruri</title>
  <meta name="description" content="Monitorizarea prețurilor la bilete de avion dus-întors">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
  <!-- Instalare pe iPhone (Adaugă pe ecranul principal) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Zboruri">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <!-- Fonturi: Inter (text) + Plus Jakarta Sans (titluri și prețuri) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Bara de sus: buton înapoi, titlul ecranului, acțiuni (completate de fiecare ecran) -->
  <header class="navbar">
    <div class="nav-side" id="nav-left"></div>
    <div class="nav-title" id="nav-title">Zboruri</div>
    <div class="nav-side right" id="nav-right"></div>
  </header>

  <!-- Aici se afișează ecranul curent -->
  <main id="app" tabindex="-1"></main>

  <!-- Bara de jos (se ascunde în formular, unde apare butonul Salvează) -->
  <nav class="tabbar" aria-label="Navigare">
    <a href="#/" data-tab="list">
      <svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
      <span>Alerte</span>
    </a>
    <a href="#/cautare" data-tab="search" class="tab-new" aria-label="Căutare rapidă">
      <i><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg></i>
      <span>Caută</span>
    </a>
    <a href="#/setari" data-tab="settings">
      <svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></svg>
      <span>Setări</span>
    </a>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
