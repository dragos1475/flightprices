<body>
  <!-- Ecran de pornire: numele aplicației și butonul „Intră” (apare după ce primul ecran e gata) -->
  <div id="splash" role="dialog" aria-label="Flight Prices">
    <div class="splash-glow" aria-hidden="true"></div>
    <div class="splash-inner">
      <img src="icons/icon-192.png" alt="" width="84" height="84" class="splash-logo">
      <svg class="splash-arc" viewBox="0 0 220 60" aria-hidden="true">
        <path d="M10,52 Q110,-10 210,52" class="splash-path" pathLength="1"/>
        <g class="splash-plane">
          <g transform="rotate(45) scale(0.8) translate(-12 -12)"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></g>
          <animateMotion dur="1.3s" begin="0.1s" fill="freeze" rotate="auto" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.2 1" path="M10,52 Q110,-10 210,52"/>
        </g>
      </svg>
      <h1 class="splash-name">Flight Prices</h1>
      <div class="splash-sub">great fares, right on time</div>
    </div>
    <div class="splash-cta">
      <!-- Butonul „Intră”: poarta de îmbarcare (radar + avion), pista cu lumini și decolarea la atingere -->
      <button type="button" class="splash-btn" id="splash-enter" disabled>
        <span class="sb-border" aria-hidden="true"></span>
        <span class="sb-gate" aria-hidden="true">
          <span class="sb-scope"><span class="sb-radar"></span></span>
          <span class="sb-trail"></span>
          <span class="sb-craft"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg></span>
        </span>
        <span class="sb-text">
          <span class="sb-kicker">Preparing your flight</span>
          <span class="sb-label">Getting ready…</span>
        </span>
        <span class="sb-chevrons" aria-hidden="true"><svg viewBox="0 0 30 16" width="30" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l5 5-5 5"/><path d="M12 3l5 5-5 5"/><path d="M21 3l5 5-5 5"/></svg></span>
        <span class="sb-lights" aria-hidden="true"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i><i style="--i:8"></i><i style="--i:9"></i><i style="--i:10"></i><i style="--i:11"></i><i style="--i:12"></i><i style="--i:13"></i></span>
      </button>
    </div>
  </div>

  <!-- Bara de sus: buton înapoi, titlul ecranului, acțiuni (completate de fiecare ecran) -->
  <header class="navbar">
    <div class="nav-side" id="nav-left"></div>
    <div class="nav-title" id="nav-title">Flight Prices</div>
    <div class="nav-side right" id="nav-right"></div>
  </header>

  <!-- Aici se afișează ecranul curent -->
  <main id="app" tabindex="-1"></main>

  <!-- Bara de jos (se ascunde în formular, unde apare butonul Salvează) -->
  <nav class="tabbar" aria-label="Navigation">
    <a href="#/" data-tab="list">
      <svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
      <span>Alerts</span>
    </a>
    <a href="#/cautare" data-tab="search" class="tab-new" aria-label="Quick search">
      <i><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg></i>
      <span>Search</span>
    </a>
    <a href="#/setari" data-tab="settings">
      <svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></svg>
      <span>Settings</span>
    </a>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
